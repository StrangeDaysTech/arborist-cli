[package]
name = "arborist-cli"
version = "0.2.1"
edition = "2024"
description = "CLI for arborist-metrics: cognitive/cyclomatic complexity and SLOC metrics"
license = "MIT OR Apache-2.0"
repository = "https://github.com/StrangeDaysTech/arborist-cli"
readme = "README.md"
keywords = ["complexity", "metrics", "cognitive", "cyclomatic", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".agent/",
    ".claude/",
    ".cursor/",
    ".cursorrules",
    ".gemini/",
    ".github/",
    ".specify/",
    ".straymark/",
    "specs/",
    "tests/fixtures/",
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "STRAYMARK.md",
]

[[bin]]
name = "arborist"
path = "src/main.rs"

[dependencies]
arborist-metrics = { version = "0.1.3", features = ["all"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
thiserror = "2"
comfy-table = "7"
csv = "1"
self_update = { version = "0.43", features = ["archive-tar", "archive-zip", "compression-flate2"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.clippy]
all = { level = "deny" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
