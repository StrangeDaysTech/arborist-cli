[package]
name = "arborist-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for arborist-metrics: cognitive/cyclomatic complexity and SLOC metrics"
license = "MIT"

[dependencies]
arborist-metrics = { version = "0.1", features = ["all"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
thiserror = "2"
comfy-table = "7"
csv = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.clippy]
all = { level = "deny" }
